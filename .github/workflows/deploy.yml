name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Kubernetes overlay
        required: true
        type: choice
        options: [dev, prod, prod-private]
        default: dev
      image_tag:
        description: GHCR tag, for example sha-abc123 or v1.0.0
        required: true
        default: latest
      ingress_host:
        description: Production ingress host; ignored by dev
        required: false
        default: rebar.example.com

concurrency:
  group: rebar-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NAMESPACE: rebar-optimizer

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v5
        with:
          version: latest
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Render manifests
        env:
          OVERLAY: deploy/k8s/overlays/${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          INGRESS_HOST: ${{ inputs.ingress_host }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG"
          kubectl kustomize "$OVERLAY" \
            | sed "s#ghcr.io/contextmachine/a101_reinforcement_am:latest#$IMAGE#g; s#rebar.example.com#$INGRESS_HOST#g" \
            > /tmp/rebar-rendered.yaml
          grep -q "$IMAGE" /tmp/rebar-rendered.yaml
      - name: Apply
        run: |
          kubectl apply -f /tmp/rebar-rendered.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/rebar-api --timeout=5m
          kubectl -n "$NAMESPACE" get deployment/rebar-worker
          kubectl -n "$NAMESPACE" get scaledobject/rebar-worker
