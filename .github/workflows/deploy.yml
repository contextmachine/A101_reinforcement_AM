name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to deploy (for example latest or sha-...)
        required: true
        default: latest
      ingress_host:
        description: Public host
        required: true
        default: rebar.example.com
      kustomize_dir:
        description: Public image base or private-image overlay
        required: true
        type: choice
        options:
          - deploy/k8s
          - deploy/k8s-private
        default: deploy/k8s

env:
  NAMESPACE: rebar-optimizer

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v5
        with:
          version: latest
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Set image and host
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          INGRESS_HOST: ${{ inputs.ingress_host }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          tag = os.environ["IMAGE_TAG"]
          for name in ("deploy/k8s/kustomization.yaml", "deploy/k8s-private/kustomization.yaml"):
              p = Path(name)
              s = p.read_text().replace("newName: ghcr.io/YOUR_ORG/YOUR_REPO", f"newName: ghcr.io/{repo}")
              s = s.replace("newTag: latest", f"newTag: {tag}")
              p.write_text(s)
          p = Path("deploy/k8s/07-ingress.yaml")
          p.write_text(p.read_text().replace("rebar.example.com", os.environ["INGRESS_HOST"]))
          PY
      - name: Validate and apply
        env:
          KUSTOMIZE_DIR: ${{ inputs.kustomize_dir }}
        run: |
          kubectl kustomize "$KUSTOMIZE_DIR" >/tmp/rebar-rendered.yaml
          kubectl apply -f /tmp/rebar-rendered.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/rebar-api --timeout=5m
          kubectl -n "$NAMESPACE" get scaledjob rebar-worker
