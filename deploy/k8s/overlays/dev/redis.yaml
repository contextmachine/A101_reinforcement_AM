apiVersion: v1
kind: Service
metadata:
  name: rebar-redis
spec:
  selector: {app: rebar-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rebar-redis
spec:
  serviceName: rebar-redis
  replicas: 1
  selector:
    matchLabels: {app: rebar-redis}
  template:
    metadata:
      labels: {app: rebar-redis}
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: redis
          image: redis:8.2-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REBAR_REDIS_PASSWORD"
          env:
            - name: REBAR_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: rebar-secrets, key: REBAR_REDIS_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "redis-cli -a \"$REBAR_REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "redis-cli -a \"$REBAR_REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 20Gi}
