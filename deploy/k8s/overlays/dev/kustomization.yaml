apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rebar-optimizer
resources:
  - ../../base
  - redis.yaml
  - keda-auth.yaml
  - worker-scaledobject.yaml
  - redis-networkpolicy.yaml
patches:
  - path: api-patch.yaml
images:
  - name: ghcr.io/YOUR_ORG/YOUR_REPO
    newName: ghcr.io/YOUR_ORG/YOUR_REPO
    newTag: latest
