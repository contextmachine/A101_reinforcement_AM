# Alternative-solver worker (rebar_service.alt_worker): KEDA ScaledJob on rebar:test:solver:*.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rebar-solver-worker-test
  namespace: rebar-optimizer
spec:
  failedJobsHistoryLimit: 30
  jobTargetRef:
    activeDeadlineSeconds: 7200
    backoffLimit: 0
    completions: 1
    parallelism: 1
    template:
      metadata:
        creationTimestamp: null
        labels:
          app: rebar-solver-worker-test
          rebar-queue-environment: test
      spec:
        automountServiceAccountToken: false
        containers:
        - command:
          - python
          - -m
          - rebar_service.alt_worker
          env:
          - name: REBAR_POSTGRES_USER
            valueFrom:
              secretKeyRef:
                key: POSTGRES_USER
                name: a101-postgres-auth
          - name: REBAR_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                key: POSTGRES_PASSWORD
                name: a101-postgres-auth
          - name: REBAR_DB_POOL_SIZE
            value: '1'
          - name: REBAR_DB_MAX_OVERFLOW
            value: '0'
          - name: REBAR_WORKER_EXIT_WHEN_IDLE
            value: 'true'
          - name: REBAR_ALT_SOLVER_WORKERS
            value: '8'
          - name: REBAR_ALT_SOLVER_TIME_LIMIT
            value: '600'
          - name: REBAR_ALT_SOLVER_CAP
            value: '50000'
          envFrom:
          - configMapRef:
              name: rebar-config-test
          - secretRef:
              name: rebar-secrets
          - configMapRef:
              name: rebar-test-solver-queues
          image: ghcr.io/contextmachine/a101_reinforcement_am:sha-e537dbd
          imagePullPolicy: IfNotPresent
          name: solver-worker
          resources:
            limits:
              cpu: '8'
              memory: 16Gi
            requests:
              cpu: 4
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /tmp
            name: tmp
          - mountPath: /tmp/rebar-cache
            name: cache
        dnsPolicy: ClusterFirst
        imagePullSecrets:
        - name: ghcr-secret
        restartPolicy: Never
        schedulerName: default-scheduler
        securityContext:
          fsGroup: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
        terminationGracePeriodSeconds: 120
        tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: rebar-jobs
        volumes:
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: cache
        nodeSelector:
          node-group: ng-rebar-jobs-e
          workload: rebar-jobs
    ttlSecondsAfterFinished: 3600
  maxReplicaCount: 12
  pollingInterval: 5
  rollout: {}
  scalingStrategy:
    strategy: default
  successfulJobsHistoryLimit: 30
  triggers:
  - authenticationRef:
      name: rebar-redis-auth
    metadata:
      activationListLength: '0'
      address: rebar-redis.rebar-optimizer.svc.cluster.local:6379
      listLength: '1'
      listName: rebar:test:solver:workload
    type: redis
