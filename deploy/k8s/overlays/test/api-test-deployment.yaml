apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebar-api-test
  namespace: rebar-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rebar-api-test
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: rebar-api-test
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - rebar_service.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        command:
        - python
        - -m
        - uvicorn
        env:
        - name: REBAR_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: a101-postgres-auth
        - name: REBAR_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: a101-postgres-auth
        envFrom:
        - configMapRef:
            name: rebar-config-test
        - secretRef:
            name: rebar-secrets
        # rebar-test-solver-queues routes new tasks to the alternative solver ScaledJob;
        # rebar-test-queues routes them to the production worker deployment (rollback).
        - configMapRef:
            name: rebar-test-solver-queues
        image: ghcr.io/contextmachine/a101_reinforcement_am:sha-ae4825a
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: tmp

