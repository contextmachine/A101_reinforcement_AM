apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebar-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rebar-api
  template:
    metadata:
      labels:
        app: rebar-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: ghcr.io/contextmachine/a101_reinforcement_am:am-super-branch
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: rebar-config}
            - secretRef: {name: rebar-secrets}
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rebar-api
spec:
  selector: {app: rebar-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rebar-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: rebar-api}
