apiVersion: v1
kind: ConfigMap
metadata:
  name: rebar-config
data:
  REBAR_QUEUE_STATE_TTL_SECONDS: '2592000'
  REBAR_POSTGRES_HOST: a101-postgres
  REBAR_POSTGRES_PORT: '5432'
  REBAR_POSTGRES_DB: a101
  REBAR_POSTGRES_SCHEMA: rebar
  REBAR_POSTGRES_SSLMODE: disable
  REBAR_DB_POOL_SIZE: '5'
  REBAR_DB_MAX_OVERFLOW: '5'
  REBAR_DB_POOL_RECYCLE_SECONDS: '1800'
  REBAR_EVENT_POLL_INTERVAL_SECONDS: '0.5'
  REBAR_MAX_UPLOAD_BYTES: '67108864'
  REBAR_MAX_SOURCE_POLYGONS: '100000'
  REBAR_MAX_PLANNED_N_VALUES: '10000'
  REBAR_MAX_N: '1000'
  REBAR_READY_QUEUE: rebar:jobs:ready
  REBAR_PROCESSING_QUEUE: rebar:jobs:processing
  REBAR_WORKLOAD_QUEUE: rebar:jobs:workload
  REBAR_BARS_READY_QUEUE: rebar:bars:ready
  REBAR_BARS_PROCESSING_QUEUE: rebar:bars:processing
  REBAR_BARS_WORKLOAD_QUEUE: rebar:bars:workload
  REBAR_VERIFICATION_READY_QUEUE: rebar:verification:ready
  REBAR_VERIFICATION_PROCESSING_QUEUE: rebar:verification:processing
  REBAR_VERIFICATION_WORKLOAD_QUEUE: rebar:verification:workload
  REBAR_WORKER_CLAIM_TIMEOUT_SECONDS: '5'
  REBAR_JOB_LEASE_SECONDS: '90'
  REBAR_MAX_JOBS_PER_TASK: '28031998'
  REBAR_WORKER_EXIT_WHEN_IDLE: 'false'
  REBAR_SOLVER_THREADS: '1'
  REBAR_FIT_THREADS: '1'
  REBAR_SOLVER_TIMEOUT: 'none'
  REBAR_SOLVER_TIME_LIMIT: 'none'
  REBAR_SOLVER_BACKEND: highs
  REBAR_REQUIRE_OPTIMAL: 'false'
  REBAR_FIT_MILP_BACKEND: auto
  REBAR_FIT_TIME_LIMIT: 'none'
  REBAR_SOLVER_LOG_DIR: /app/logs
  # Large v2 artifacts on the shared csi-s3 volume (workers mount it at /app/artifacts).
  REBAR_ARTIFACT_DIR: /app/artifacts
  REBAR_ARTIFACT_CACHE_DIR: /tmp/rebar-cache/artifacts
  # Extra HiGHS options for the solving stage as a JSON object, e.g. '{"presolve": "off"}'.
  REBAR_HIGHS_OPTIONS: '{}'
  # 0 = exhaustive candidate enumeration; >0 = lattice-tightened pool capped at this many rectangles.
  REBAR_CANDIDATE_LATTICE_CAP: '0'
  REBAR_CORS_ORIGINS: '*'
  REBAR_SCHEDULER_BATCH_SIZE: '256'
  REBAR_COMBINE_BATCH_SIZE: '256'
  REBAR_GRID_SIZE: '300'
  REBAR_FILL_NOTCHES: '1000'
  REBAR_SHORT_EDGE: '300'
  REBAR_SIMPLIFY_STEP: '1000'
  REBAR_USE_MOSAIC: 'true'
  REBAR_MIN_INTERNAL_STEP: '100'
  REBAR_FRONTIER_TOP_K: '5'
