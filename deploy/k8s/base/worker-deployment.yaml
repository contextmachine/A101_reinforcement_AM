apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebar-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: rebar-worker
  template:
    metadata:
      labels:
        app: rebar-worker
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: heavy-jobs
      terminationGracePeriodSeconds: 21630
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/contextmachine/a101_reinforcement_am:am-super-branch
        imagePullPolicy: Always
        command:
          - python
          - -m
          - rebar_service.worker
        envFrom:
        - configMapRef:
            name: rebar-config
        - secretRef:
            name: rebar-secrets
        env:
        - name: REBAR_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: a101-postgres-auth
              key: POSTGRES_USER
        - name: REBAR_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: a101-postgres-auth
              key: POSTGRES_PASSWORD
        - name: REBAR_DB_POOL_SIZE
          value: "1"
        - name: REBAR_DB_MAX_OVERFLOW
          value: "0"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /tmp/rebar-cache
        - name: solver-logs
          mountPath: /app/logs
          subPath: rebar-optimizer/logs
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 8Gi
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: solver-logs
        persistentVolumeClaim:
          claimName: rebar-solver-logs
