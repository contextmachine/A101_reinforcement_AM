apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebar-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: rebar-worker
  template:
    metadata:
      labels:
        app: rebar-worker
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: heavy-jobs
      terminationGracePeriodSeconds: 21630
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/contextmachine/a101_reinforcement_am:am-super-branch
        imagePullPolicy: Always
        command:
          - python
          - -m
          - rebar_service.universal_worker
        envFrom:
        - configMapRef:
            name: rebar-config
        - secretRef:
            name: rebar-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /tmp/rebar-cache
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 8Gi
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
