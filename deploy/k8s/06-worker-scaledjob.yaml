apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rebar-worker
  namespace: rebar-optimizer
spec:
  pollingInterval: 5
  minReplicaCount: 0
  # Global maximum across all user tasks. Keep this equal to
  # REBAR_GLOBAL_MAX_JOBS in the ConfigMap.
  maxReplicaCount: 32
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  rollout:
    strategy: gradual
  # Ready-list length excludes jobs already moved to the processing list.
  scalingStrategy:
    strategy: accurate
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 1
    activeDeadlineSeconds: 86400
    ttlSecondsAfterFinished: 300
    template:
      metadata:
        labels:
          app: rebar-worker
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            image: ghcr.io/YOUR_ORG/YOUR_REPO:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "rebar_service.worker"]
            envFrom:
              - configMapRef:
                  name: rebar-config
              - secretRef:
                  name: rebar-secrets
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: cache
                mountPath: /tmp/rebar-cache
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "4"
                memory: 8Gi
        volumes:
          - name: tmp
            emptyDir: {}
          - name: cache
            emptyDir: {}
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REBAR_REDIS_ADDRESS
        listName: rebar:jobs:ready
        listLength: "1"
        activationListLength: "0"
      authenticationRef:
        name: rebar-redis-auth
